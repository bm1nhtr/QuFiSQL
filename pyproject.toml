[tool.poetry]
name = "quant-finance"
version = "0.1.0"
description = "Console application for Quant Finance MySQL database"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
mysql-connector-python = ">=8.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/__main__.py" = ["E402"]
